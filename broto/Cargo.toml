[package]
name = "broto"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[example]]
name = "sync"
required-features = ["sync"]

[[example]]
name = "async"
required-features = ["async"]

[dependencies]
broto-derive = { path = "../broto-derive" }
futures = { workspace = true, optional = true }
futures-io = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["io"], optional = true }
thiserror = { workspace = true }

[dev-dependencies]
futures = "0.3"

[features]
default = []
async = ["broto-derive/async", "dep:futures-io", "dep:futures-util", "dep:futures"]
sync = ["broto-derive/sync"]
